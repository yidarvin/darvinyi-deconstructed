<style>

  body { background:#0a0e0f; color:#e6edf0; font-family:"JetBrains Mono",ui-monospace,monospace; margin:0; padding:2rem; }

<body>
<h1><span class="c">/* </span>alexey-yurenev - proofs<span class="c"> */</span></h1>
<p class="sub">11 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-silent-hero-01.png" alt="01-silent-hero-01" loading="lazy">
  <figcaption><span class="id">01-silent-hero-01</span><br>A fragile portrait occupies a small dark island below a vast white field.</figcaption>
</figure>
<figure>
  <img src="02-silent-hero-02.png" alt="02-silent-hero-02" loading="lazy">
  <figcaption><span class="id">02-silent-hero-02</span><br>The small procession climbs toward the monument across a broad snow slope.</figcaption>
</figure>
<figure>
  <img src="03-silent-hero-03.png" alt="03-silent-hero-03" loading="lazy">
  <figcaption><span class="id">03-silent-hero-03</span><br>A speeding dark band crosses the rails, converting depth into motion blur.</figcaption>
</figure>
<figure>
  <img src="04-silent-hero-04.png" alt="04-silent-hero-04" loading="lazy">
  <figcaption><span class="id">04-silent-hero-04</span><br>A nearly centered branching mass makes intricate line press against an empty field.</figcaption>
</figure>
<figure>
  <img src="05-silent-hero-05.png" alt="05-silent-hero-05" loading="lazy">
  <figcaption><span class="id">05-silent-hero-05</span><br>The monument is displaced to the edge, leaving the empty sky to carry the frame.</figcaption>
</figure>
<figure>
  <img src="06-silent-hero-06.png" alt="06-silent-hero-06" loading="lazy">
  <figcaption><span class="id">06-silent-hero-06</span><br>Blots and streaks interrupt a landscape whose low horizontal is still barely legible.</figcaption>
</figure>
<figure>
  <img src="07-silent-hero-07.png" alt="07-silent-hero-07" loading="lazy">
  <figcaption><span class="id">07-silent-hero-07</span><br>A bounded matrix recasts image information as repeated, granular cells.</figcaption>
</figure>
<figure>
  <img src="08-silent-hero-08.png" alt="08-silent-hero-08" loading="lazy">
  <figcaption><span class="id">08-silent-hero-08</span><br>Portrait fragments hover above the meadow, with their separation becoming the subject.</figcaption>
</figure>
<figure>
  <img src="09-silent-hero-09.png" alt="09-silent-hero-09" loading="lazy">
  <figcaption><span class="id">09-silent-hero-09</span><br>A damaged portrait interrupts an otherwise symmetrical blue stained-glass interior.</figcaption>
</figure>
<figure>
  <img src="10-silent-hero-10.png" alt="10-silent-hero-10" loading="lazy">
  <figcaption><span class="id">10-silent-hero-10</span><br>An ordered field of tiny frames shifts attention from one image to comparative sampling.</figcaption>
</figure>
<figure>
  <img src="11-silent-hero-11.png" alt="11-silent-hero-11" loading="lazy">
  <figcaption><span class="id">11-silent-hero-11</span><br>Two unequal scenes stay separate across a narrow gap: bodily burden at left, open terrain at right.</figcaption>
</figure>
