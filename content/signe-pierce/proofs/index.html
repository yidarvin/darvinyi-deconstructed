<h1><span class="c">/* </span>signe-pierce - proofs<span class="c"> */</span></h1>
<p class="sub">12 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-cheap-thrills.png" alt="01-cheap-thrills" loading="lazy">
  <figcaption><span class="id">01-cheap-thrills</span><br>A glossy donut gives the upward-fanning bills a deliberately theatrical pedestal.</figcaption>
</figure>
<figure>
  <img src="02-mirrorgaze.png" alt="02-mirrorgaze" loading="lazy">
  <figcaption><span class="id">02-mirrorgaze</span><br>The car mirror creates a small portrait aperture inside an aggressively diagonal vehicle frame.</figcaption>
</figure>
<figure>
  <img src="03-3am-donut-shop.png" alt="03-3am-donut-shop" loading="lazy">
  <figcaption><span class="id">03-3am-donut-shop</span><br>Tables recede toward a continuous neon band, making the shop both empty and insistently staged.</figcaption>
</figure>
<figure>
  <img src="04-chinese-takeout-ii.png" alt="04-chinese-takeout-ii" loading="lazy">
  <figcaption><span class="id">04-chinese-takeout-ii</span><br>A panoramic mural supplies a second landscape above the dining room&#x27;s quiet seating rhythm.</figcaption>
</figure>
<figure>
  <img src="05-column-rail.png" alt="05-column-rail" loading="lazy">
  <figcaption><span class="id">05-column-rail</span><br>The dark handrail cuts through the column&#x27;s vertical mass and turns the threshold into a collision of directions.</figcaption>
</figure>
<figure>
  <img src="06-heightened-realism.png" alt="06-heightened-realism" loading="lazy">
  <figcaption><span class="id">06-heightened-realism</span><br>A foreground plant obscures an empty, blinds-lit interior and makes depth feel constructed rather than neutral.</figcaption>
</figure>
<figure>
  <img src="07-hyperspace.png" alt="07-hyperspace" loading="lazy">
  <figcaption><span class="id">07-hyperspace</span><br>Tilted ceiling panels and parallel fluorescent tubes convert a tiled corner into a chromatic diagram.</figcaption>
</figure>
<figure>
  <img src="08-kawasaki-angel.png" alt="08-kawasaki-angel" loading="lazy">
  <figcaption><span class="id">08-kawasaki-angel</span><br>The fuel tank is a large blue anchor while handlebars thrust the eye upward through the close mechanical view.</figcaption>
</figure>
<figure>
  <img src="09-strip-mall-of-the-gods.png" alt="09-strip-mall-of-the-gods" loading="lazy">
  <figcaption><span class="id">09-strip-mall-of-the-gods</span><br>Statuary becomes a foreground proscenium around the commercial sign and receding asphalt.</figcaption>
</figure>
<figure>
  <img src="10-neon-snow-i.png" alt="10-neon-snow-i" loading="lazy">
  <figcaption><span class="id">10-neon-snow-i</span><br>Pinks, cyan melt channels, and granular snow suppress ordinary scale into an all-over luminous surface.</figcaption>
</figure>
<figure>
  <img src="11-neon-palm.png" alt="11-neon-palm" loading="lazy">
  <figcaption><span class="id">11-neon-palm</span><br>A silhouetted palm spine slices through the dotted pink field and a lamp&#x27;s hard halo.</figcaption>
</figure>
<figure>
  <img src="12-self-parallaxxx.png" alt="12-self-parallaxxx" loading="lazy">
  <figcaption><span class="id">12-self-parallaxxx</span><br>Screens, reflection, flowers, and a camera make a dense apparatus of recursive looking.</figcaption>
</figure>
