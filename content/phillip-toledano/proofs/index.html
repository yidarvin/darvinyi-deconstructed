<body>
<h1><span class="c">/* </span>phillip-toledano - proofs<span class="c"> */</span></h1>
<p class="sub">12 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-building-melting.png" alt="01-building-melting" loading="lazy">
  <figcaption><span class="id">01-building-melting</span><br>Two intact street walls funnel attention toward a collapsed central facade whose distorted line defeats their order.</figcaption>
</figure>
<figure>
  <img src="02-zeppelin-crash.png" alt="02-zeppelin-crash" loading="lazy">
  <figcaption><span class="id">02-zeppelin-crash</span><br>The enormous rounded hull interrupts a narrow vertical street corridor while the right facade keeps receding behind it.</figcaption>
</figure>
<figure>
  <img src="03-owl-hat.png" alt="03-owl-hat" loading="lazy">
  <figcaption><span class="id">03-owl-hat</span><br>A frontal portrait is made uncanny by a vertical stack from direct gaze to an enlarged crown of owls.</figcaption>
</figure>
<figure>
  <img src="04-giant-crater.png" alt="04-giant-crater" loading="lazy">
  <figcaption><span class="id">04-giant-crater</span><br>Pedestrians and streets describe the rim, making the central crater read as a void with a measurable civic scale.</figcaption>
</figure>
<figure>
  <img src="05-alley-monkey.png" alt="05-alley-monkey" loading="lazy">
  <figcaption><span class="id">05-alley-monkey</span><br>The curb and receding brick wall funnel an empty alley toward a small, downcast primate figure.</figcaption>
</figure>
<figure>
  <img src="06-tsunami.png" alt="06-tsunami" loading="lazy">
  <figcaption><span class="id">06-tsunami</span><br>A broad, broken water band scatters human figures between a hazed skyline and a heavy foreground swell.</figcaption>
</figure>
<figure>
  <img src="07-crow-hat.png" alt="07-crow-hat" loading="lazy">
  <figcaption><span class="id">07-crow-hat</span><br>A nearly frontal face is held beneath a wide brim, while the small crows turn the crown into a lateral disturbance.</figcaption>
</figure>
<figure>
  <img src="08-snowy-portrait.png" alt="08-snowy-portrait" loading="lazy">
  <figcaption><span class="id">08-snowy-portrait</span><br>A seated man becomes the small dark center of an irregular, nearly frame-filling mass of white poodles.</figcaption>
</figure>
<figure>
  <img src="09-woman-on-fire.png" alt="09-woman-on-fire" loading="lazy">
  <figcaption><span class="id">09-woman-on-fire</span><br>The face and coat remain a compact portrait while a flame rises into the empty upper street and traffic recedes behind.</figcaption>
</figure>
<figure>
  <img src="10-belgian-helmet.png" alt="10-belgian-helmet" loading="lazy">
  <figcaption><span class="id">10-belgian-helmet</span><br>A clear globe encloses a child’s face and red cap, turning an ordinary snowy portrait into a nested circular structure.</figcaption>
</figure>
<figure>
  <img src="11-giant-jellyfish.png" alt="11-giant-jellyfish" loading="lazy">
  <figcaption><span class="id">11-giant-jellyfish</span><br>A suspended jellyfish bell and its fine tentacles occupy the pale sky while hard facade edges retain the street’s scale.</figcaption>
</figure>
<figure>
  <img src="12-frozen-man.png" alt="12-frozen-man" loading="lazy">
  <figcaption><span class="id">12-frozen-man</span><br>The exposed face and diagonal coat are squeezed between a snowy street band and an encroaching foreground snowbank.</figcaption>
</figure>
