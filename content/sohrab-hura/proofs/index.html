<h1><span class="c">/* </span>sohrab-hura - proofs<span class="c"> */</span></h1>
<p class="sub">12 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-the-levee-i.png" alt="01-the-levee-i" loading="lazy">
  <figcaption><span class="id">01-the-levee-i</span><br>The boot projects into a low, horizontal river world; leg and shoe make the foreground press against the water bands.</figcaption>
</figure>
<figure>
  <img src="02-the-levee-ii.png" alt="02-the-levee-ii" loading="lazy">
  <figcaption><span class="id">02-the-levee-ii</span><br>The supporting arm, stacked blocks, and pocket make a compact flash-lit material cluster against dispersed rubble.</figcaption>
</figure>
<figure>
  <img src="03-the-levee-iii.png" alt="03-the-levee-iii" loading="lazy">
  <figcaption><span class="id">03-the-levee-iii</span><br>A small bird rides a branch through an overwhelmingly blank field.</figcaption>
</figure>
<figure>
  <img src="04-snow-i.png" alt="04-snow-i" loading="lazy">
  <figcaption><span class="id">04-snow-i</span><br>A raised hand interrupts the long diagonal of a prone figure across an open green ground.</figcaption>
</figure>
<figure>
  <img src="05-snow-ii.png" alt="05-snow-ii" loading="lazy">
  <figcaption><span class="id">05-snow-ii</span><br>The red current makes a zigzag path through a loose rhythm of pale stones.</figcaption>
</figure>
<figure>
  <img src="06-snow-iii.png" alt="06-snow-iii" loading="lazy">
  <figcaption><span class="id">06-snow-iii</span><br>The scorched tree makes a hard vertical interruption in the largely white snow field.</figcaption>
</figure>
<figure>
  <img src="07-the-coast-i.png" alt="07-the-coast-i" loading="lazy">
  <figcaption><span class="id">07-the-coast-i</span><br>A small green parakeet sits at the hand&#x27;s end and is doubled by its dark shadow on yellow.</figcaption>
</figure>
<figure>
  <img src="08-the-coast-ii.png" alt="08-the-coast-ii" loading="lazy">
  <figcaption><span class="id">08-the-coast-ii</span><br>Hard flash turns the figure into a nearly white vertical flare against the surrounding black.</figcaption>
</figure>
<figure>
  <img src="09-the-coast-iii.png" alt="09-the-coast-iii" loading="lazy">
  <figcaption><span class="id">09-the-coast-iii</span><br>Two flash-lit figures at different heights make the black shore a theatrical field of distance and shadow.</figcaption>
</figure>
<figure>
  <img src="10-pati.png" alt="10-pati" loading="lazy">
  <figcaption><span class="id">10-pati</span><br>The winding road carries the procession through an eroded valley and makes the group a small human measure.</figcaption>
</figure>
<figure>
  <img src="11-look-its-getting-sunny-outside.png" alt="11-look-its-getting-sunny-outside" loading="lazy">
  <figcaption><span class="id">11-look-its-getting-sunny-outside</span><br>A pointed hand redirects the flash-lit domestic scene from the woman toward the dog on the bed.</figcaption>
</figure>
<figure>
  <img src="12-life-is-elsewhere-g4.png" alt="12-life-is-elsewhere-g4" loading="lazy">
  <figcaption><span class="id">12-life-is-elsewhere-g4</span><br>The cone makes the foreground dog an enclosing circle while the sleeping figure recedes into bedding.</figcaption>
</figure>
</div>
