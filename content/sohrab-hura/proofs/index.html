<h1>/* sohrab-hura - proofs */</h1>
<p>12 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure><img src="01-the-levee-i.png" alt="The Levee I overlay"><figcaption><span class="id">01</span> Boot, bank, water, and distant treeline resolve into stacked bands.</figcaption></figure>
<figure><img src="02-the-levee-ii.png" alt="The Levee II overlay"><figcaption><span class="id">02</span> Jacket, hand, bricks, and rubble cross in a flash-lit material field.</figcaption></figure>
<figure><img src="03-the-levee-iii.png" alt="The Levee III overlay"><figcaption><span class="id">03</span> A bird's perch crosses a deliberately near-empty field.</figcaption></figure>
<figure><img src="04-snow-i.png" alt="Snow I overlay"><figcaption><span class="id">04</span> A raised hand and covered face interrupt a reclined diagonal.</figcaption></figure>
<figure><img src="05-snow-ii.png" alt="Snow II overlay"><figcaption><span class="id">05</span> Red water zigzags between irregular stone forms.</figcaption></figure>
<figure><img src="06-snow-iii.png" alt="Snow III overlay"><figcaption><span class="id">06</span> A pruned tree, ladder, and figure puncture the snow field.</figcaption></figure>
<figure><img src="07-the-coast-i.png" alt="The Coast I overlay"><figcaption><span class="id">07</span> A parakeet and hand become a small, doubled event on yellow.</figcaption></figure>
<figure><img src="08-the-coast-ii.png" alt="The Coast II overlay"><figcaption><span class="id">08</span> Direct flash makes the body flare against surrounding black.</figcaption></figure>
<figure><img src="09-the-coast-iii.png" alt="The Coast III overlay"><figcaption><span class="id">09</span> Separated figures and shadow turn the shore into a stage.</figcaption></figure>
<figure><img src="10-pati.png" alt="Pati overlay"><figcaption><span class="id">10</span> A receding route turns walkers into a measure of the valley.</figcaption></figure>
<figure><img src="11-look-its-getting-sunny-outside.png" alt="Look It's Getting Sunny Outside overlay"><figcaption><span class="id">11</span> A pointed finger turns a room into a relation between woman and dog.</figcaption></figure>
<figure><img src="12-life-is-elsewhere-g4.png" alt="Life is Elsewhere G4 overlay"><figcaption><span class="id">12</span> The protective cone frames a dog before a sleeping figure.</figcaption></figure>
