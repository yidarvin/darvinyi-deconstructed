<h1><span class="c">/* </span>miss-aniela - proofs<span class="c"> */</span></h1>
<p class="sub">10 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-white-witch-awakening.png" alt="01-white-witch-awakening" loading="lazy">
  <figcaption><span class="id">01-white-witch-awakening</span><br>The central performer and zebra activate an otherwise pale architectural volume.</figcaption>
</figure>
<figure>
  <img src="02-swan-lake.png" alt="02-swan-lake" loading="lazy">
  <figcaption><span class="id">02-swan-lake</span><br>A near-central dancer turns the room&#x27;s symmetry into a theatrical stage.</figcaption>
</figure>
<figure>
  <img src="03-pokerface.png" alt="03-pokerface" loading="lazy">
  <figcaption><span class="id">03-pokerface</span><br>Two floorward diagonals destabilize a cool, ornamental interior around the seated figure.</figcaption>
</figure>
<figure>
  <img src="04-away-with-the-canaries.png" alt="04-away-with-the-canaries" loading="lazy">
  <figcaption><span class="id">04-away-with-the-canaries</span><br>The stair rail and flight of yellow birds pull the eye out of the figure&#x27;s dress.</figcaption>
</figure>
<figure>
  <img src="05-storm-door.png" alt="05-storm-door" loading="lazy">
  <figcaption><span class="id">05-storm-door</span><br>A literal doorway contains the figure while the invented sea crosses its threshold.</figcaption>
</figure>
<figure>
  <img src="06-poster-and-plumage.png" alt="06-poster-and-plumage" loading="lazy">
  <figcaption><span class="id">06-poster-and-plumage</span><br>A pale figure nearly merges with the patterned room before the bed posts restore structure.</figcaption>
</figure>
<figure>
  <img src="07-kai-face.png" alt="07-kai-face" loading="lazy">
  <figcaption><span class="id">07-kai-face</span><br>A frontal face becomes an image-bearing surface, held by a near-perfect central axis.</figcaption>
</figure>
<figure>
  <img src="08-girl-of-prey.png" alt="08-girl-of-prey" loading="lazy">
  <figcaption><span class="id">08-girl-of-prey</span><br>The wings make a broad diagonal counterweight to the turned figure and bright window.</figcaption>
</figure>
<figure>
  <img src="09-migration-season.png" alt="09-migration-season" loading="lazy">
  <figcaption><span class="id">09-migration-season</span><br>The square field deliberately withholds a single stable visual resting place.</figcaption>
</figure>
<figure>
  <img src="10-ignite-mares.png" alt="10-ignite-mares" loading="lazy">
  <figcaption><span class="id">10-ignite-mares</span><br>The red dress turns the portrait into a vertical, animal-charged surge.</figcaption>
</figure>
