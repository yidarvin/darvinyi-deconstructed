<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>max-pinckers - proofs</title>
<style>
  :root { color-scheme: dark; }
  body { background:#0a0e0f; color:#e6edf0; font-family:"JetBrains Mono",ui-monospace,monospace; margin:0; padding:2rem; }
  h1 { font-size:1rem; font-weight:700; letter-spacing:.02em; }
  h1 .c { color:#55707b; }
  p.sub { color:#7d919b; font-size:.8rem; margin-top:-.3rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.25rem; margin-top:1.5rem; }
  figure { margin:0; border:1px solid #1e2a30; border-radius:.5rem; background:#10171a; padding:.6rem; }
  figure img { width:100%; height:auto; display:block; border-radius:.25rem; background:#000; }
  figcaption { margin-top:.5rem; font-size:.72rem; color:#7d919b; line-height:1.4; }
  figcaption .id { color:#2dd4bf; }
</style>
</head>
<body>
<h1><span class="c">/* </span>max-pinckers - proofs<span class="c"> */</span></h1>
<p class="sub">11 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-ice-pillar.png" alt="01-ice-pillar" loading="lazy">
  <figcaption><span class="id">01-ice-pillar</span><br>A slightly off-centre column braces a low, divided interior.</figcaption>
</figure>
<figure>
  <img src="02-peacock.png" alt="02-peacock" loading="lazy">
  <figcaption><span class="id">02-peacock</span><br>An isolated animal and its shadow turn the courtyard into a compact stage.</figcaption>
</figure>
<figure>
  <img src="03-rooftop-mattresses.png" alt="03-rooftop-mattresses" loading="lazy">
  <figcaption><span class="id">03-rooftop-mattresses</span><br>A hanging diagonal cuts the sky while two mattresses hold the roof plane down.</figcaption>
</figure>
<figure>
  <img src="04-ceremonial-cart.png" alt="04-ceremonial-cart" loading="lazy">
  <figcaption><span class="id">04-ceremonial-cart</span><br>The cart&#x27;s frontal symmetry makes a polished prop sit improbably in an open field.</figcaption>
</figure>
<figure>
  <img src="05-men-at-concrete-wall.png" alt="05-men-at-concrete-wall" loading="lazy">
  <figcaption><span class="id">05-men-at-concrete-wall</span><br>Staggered figures occupy apertures cut into a shallow concrete stage.</figcaption>
</figure>
<figure>
  <img src="06-papers-in-suburb.png" alt="06-papers-in-suburb" loading="lazy">
  <figcaption><span class="id">06-papers-in-suburb</span><br>White sheets make a distributed diagonal between two suited figures and ordinary houses.</figcaption>
</figure>
<figure>
  <img src="07-figure-in-street.png" alt="07-figure-in-street" loading="lazy">
  <figcaption><span class="id">07-figure-in-street</span><br>Street perspective makes an ambiguous action read as a staged interruption.</figcaption>
</figure>
<figure>
  <img src="08-fallen-figure.png" alt="08-fallen-figure" loading="lazy">
  <figcaption><span class="id">08-fallen-figure</span><br>A crouched body and hard shadows convert asphalt into a field of competing directions.</figcaption>
</figure>
<figure>
  <img src="09-shadow-street.png" alt="09-shadow-street" loading="lazy">
  <figcaption><span class="id">09-shadow-street</span><br>A porch frame contains three bodies while the sunlit threshold turns the encounter into a stage.</figcaption>
</figure>
<figure>
  <img src="10-car-mirror.png" alt="10-car-mirror" loading="lazy">
  <figcaption><span class="id">10-car-mirror</span><br>Dashboard, windscreen, and mirror layer several viewing positions in one compressed image.</figcaption>
</figure>
<figure>
  <img src="11-subway-platform.png" alt="11-subway-platform" loading="lazy">
  <figcaption><span class="id">11-subway-platform</span><br>Near-symmetrical train geometry is broken by one walking counterpoint.</figcaption>
</figure>
</div>
</body>
</html>
