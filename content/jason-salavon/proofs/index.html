<h1><span class="c">/* </span>jason-salavon - proofs<span class="c"> */</span></h1>
<p class="sub">12 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-golem-printer.png" alt="01-golem-printer" loading="lazy">
  <figcaption><span class="id">01-golem-printer</span><br>The installation documentation uses a centered printer and unspooling paper to turn generated pictures into a vertical procession.</figcaption>
</figure>
<figure>
  <img src="02-homes-dallas-fort-worth.png" alt="02-homes-dallas-fort-worth" loading="lazy">
  <figcaption><span class="id">02-homes-dallas-fort-worth</span><br>A soft centered landscape is presented as a print, with the small caption reinforcing its typological status.</figcaption>
</figure>
<figure>
  <img src="03-emblem-apocalypse-now.png" alt="03-emblem-apocalypse-now" loading="lazy">
  <figcaption><span class="id">03-emblem-apocalypse-now</span><br>Sampled film frames become a centered, concentric emblem rather than a scene.</figcaption>
</figure>
<figure>
  <img src="04-100-special-moments-newlyweds.png" alt="04-100-special-moments-newlyweds" loading="lazy">
  <figcaption><span class="id">04-100-special-moments-newlyweds</span><br>Two facial masses and opposed pale and dark body masses remain legible while the individual photographs dissolve.</figcaption>
</figure>
<figure>
  <img src="05-100-special-moments-little-leaguer.png" alt="05-100-special-moments-little-leaguer" loading="lazy">
  <figcaption><span class="id">05-100-special-moments-little-leaguer</span><br>A conventional centered sports portrait survives the averaging as a single softened figure.</figcaption>
</figure>
<figure>
  <img src="06-still-life-speed-of-sunrise.png" alt="06-still-life-speed-of-sunrise" loading="lazy">
  <figcaption><span class="id">06-still-life-speed-of-sunrise</span><br>The documented display frame contains a centered generated still life, with its base held low in the field.</figcaption>
</figure>
<figure>
  <img src="07-the-loop-chicago.png" alt="07-the-loop-chicago" loading="lazy">
  <figcaption><span class="id">07-the-loop-chicago</span><br>Three photographed lightboxes stage a transparent city as a continuous lateral corridor.</figcaption>
</figure>
<figure>
  <img src="08-american-varietal-us-population.png" alt="08-american-varietal-us-population" loading="lazy">
  <figcaption><span class="id">08-american-varietal-us-population</span><br>The installation&#x27;s long panel array turns data into an angled sequence of colour fields.</figcaption>
</figure>
<figure>
  <img src="09-baroque-painting.png" alt="09-baroque-painting" loading="lazy">
  <figcaption><span class="id">09-baroque-painting</span><br>Repeated square borders carry a palette system inward to a small central aperture.</figcaption>
</figure>
<figure>
  <img src="10-color-wheel.png" alt="10-color-wheel" loading="lazy">
  <figcaption><span class="id">10-color-wheel</span><br>Small search-result images are ordered as a ring with a deliberately empty center.</figcaption>
</figure>
<figure>
  <img src="11-good-and-evil-12.png" alt="11-good-and-evil-12" loading="lazy">
  <figcaption><span class="id">11-good-and-evil-12</span><br>Two tall, closely spaced image fields make the binary search system read as a paired installation.</figcaption>
</figure>
<figure>
  <img src="12-automatic-pattern-for-you.png" alt="12-automatic-pattern-for-you" loading="lazy">
  <figcaption><span class="id">12-automatic-pattern-for-you</span><br>A gridded display lets distinct procedural patterns read as one ordered field.</figcaption>
</figure>
