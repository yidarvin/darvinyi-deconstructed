<h1><span class="c">/* </span>alex-prager - proofs<span class="c"> */</span></h1>
<p class="sub">10 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-crowd-3-pelican-beach-2013.png" alt="01-crowd-3-pelican-beach-2013" loading="lazy">
  <figcaption><span class="id">01-crowd-3-pelican-beach-2013</span><br>Small clusters, towels, and bright costume accents make the beach a deliberately distributed field.</figcaption>
</figure>
<figure>
  <img src="02-crowd-4-new-haven-2013.png" alt="02-crowd-4-new-haven-2013" loading="lazy">
  <figcaption><span class="id">02-crowd-4-new-haven-2013</span><br>The blonde striped figure interrupts a dense overhead pattern of heads, shoulders, and floor tiles.</figcaption>
</figure>
<figure>
  <img src="03-crowd-5-washington-square-west-2013.png" alt="03-crowd-5-washington-square-west-2013" loading="lazy">
  <figcaption><span class="id">03-crowd-5-washington-square-west-2013</span><br>A dark wall and a slightly tilted window turn the gathering into a framed interior stage.</figcaption>
</figure>
<figure>
  <img src="04-crowd-6-hazelwood-2013.png" alt="04-crowd-6-hazelwood-2013" loading="lazy">
  <figcaption><span class="id">04-crowd-6-hazelwood-2013</span><br>A bright central costume holds its ground inside a smoky, laterally compressed crowd.</figcaption>
</figure>
<figure>
  <img src="05-crowd-7-bob-hope-airport-2013.png" alt="05-crowd-7-bob-hope-airport-2013" loading="lazy">
  <figcaption><span class="id">05-crowd-7-bob-hope-airport-2013</span><br>The checkerboard floor gives the waiting figures a loose diagonal rhythm and makes luggage an active color cue.</figcaption>
</figure>
<figure>
  <img src="06-crowd-8-city-hall-2013.png" alt="06-crowd-8-city-hall-2013" loading="lazy">
  <figcaption><span class="id">06-crowd-8-city-hall-2013</span><br>The rigid exit portal compresses a long line of figures before releasing them onto the red-carpet foreground.</figcaption>
</figure>
<figure>
  <img src="07-crowd-9-sunset-five-2013.png" alt="07-crowd-9-sunset-five-2013" loading="lazy">
  <figcaption><span class="id">07-crowd-9-sunset-five-2013</span><br>Tiered seating makes spectators read in rows while the red blouse interrupts the cool, repeated seats.</figcaption>
</figure>
<figure>
  <img src="08-crowd-10-imperial-theatre-2013.png" alt="08-crowd-10-imperial-theatre-2013" loading="lazy">
  <figcaption><span class="id">08-crowd-10-imperial-theatre-2013</span><br>A turquoise figure becomes a calm focal point inside a red-carpet field of overlapping evening dress.</figcaption>
</figure>
<figure>
  <img src="09-crowd-11-cedar-and-broad-street-2013.png" alt="09-crowd-11-cedar-and-broad-street-2013" loading="lazy">
  <figcaption><span class="id">09-crowd-11-cedar-and-broad-street-2013</span><br>The signal and a turquoise dress make two clear stops in an otherwise centrifugal street crowd.</figcaption>
</figure>
<figure>
  <img src="10-crowd-12-speedy-click-2013.png" alt="10-crowd-12-speedy-click-2013" loading="lazy">
  <figcaption><span class="id">10-crowd-12-speedy-click-2013</span><br>A high curtain field opens above scattered social knots, with the raised cup acting as a small bright signal.</figcaption>
</figure>
