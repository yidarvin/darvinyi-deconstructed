<h1><span class="c">/* </span>viviane-sassen - proofs<span class="c"> */</span></h1>
<p class="sub">10 plates. Deterministic overlays rendered by the composition-analysis skill.</p>
<div class="grid">
<figure>
  <img src="01-totem.png" alt="01-totem" loading="lazy">
  <figcaption><span class="id">01-totem</span><br>A paired head mass and two arms make the tightly cropped portrait read as one compact, asymmetrical body.</figcaption>
</figure>
<figure>
  <img src="02-mirror-man.png" alt="02-mirror-man" loading="lazy">
  <figcaption><span class="id">02-mirror-man</span><br>The narrow mirror divides the body into near and reflected planes while the yellow shirt crosses the seam.</figcaption>
</figure>
<figure>
  <img src="03-dora-and-viola.png" alt="03-dora-and-viola" loading="lazy">
  <figcaption><span class="id">03-dora-and-viola</span><br>Two trees hold an embrace whose striped and pale garments fuse into a single vertical mass.</figcaption>
</figure>
<figure>
  <img src="04-jf.png" alt="04-jf" loading="lazy">
  <figcaption><span class="id">04-jf</span><br>Two diagonal bodies lean into a small green mirror, with their shadow acting as a third dark shape.</figcaption>
</figure>
<figure>
  <img src="05-100-years.png" alt="05-100-years" loading="lazy">
  <figcaption><span class="id">05-100-years</span><br>Bent bodies meet across a colored sheet while the large lower shadow makes the pavement a graphic stage.</figcaption>
</figure>
<figure>
  <img src="06-testament.png" alt="06-testament" loading="lazy">
  <figcaption><span class="id">06-testament</span><br>A small flame breaks the portrait&#x27;s darkness, joining a shadowed face to the paper held at the lower threshold.</figcaption>
</figure>
<figure>
  <img src="07-axiom-g03.png" alt="07-axiom-g03" loading="lazy">
  <figcaption><span class="id">07-axiom-g03</span><br>A slim upright mirror splits the sand into a black reflected wedge and a broad green shadow.</figcaption>
</figure>
<figure>
  <img src="08-marte-01.png" alt="08-marte-01" loading="lazy">
  <figcaption><span class="id">08-marte-01</span><br>A cropped shoulder and a kneeling body make the pool-colored field feel like a shallow sculptural plane.</figcaption>
</figure>
<figure>
  <img src="09-mirari-2.png" alt="09-mirari-2" loading="lazy">
  <figcaption><span class="id">09-mirari-2</span><br>Two dark trunks interrupt an expanse of water whose bright lower reflection makes the frame breathe sideways.</figcaption>
</figure>
<figure>
  <img src="10-almando-fuchsia.png" alt="10-almando-fuchsia" loading="lazy">
  <figcaption><span class="id">10-almando-fuchsia</span><br>A saturated sheet spans between a hand and a profile, making color the image&#x27;s central plane.</figcaption>
</figure>
